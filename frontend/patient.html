<!doctype html>
<html lang="en"><head><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homestretch Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a 1194x834 tablet app (tab bar + scrolling content, full-screen session mode), scaled to fit under a slim prototype toolbar. Tokens follow the Homestretch design system. */
:root{
  --surface:#F3F5F8; --raised:#FFFFFF; --sunken:#E9ECF1;
  --ink:#0E1116; --ink-sel:#2B3038; --ink-body:#3D434C; --ink-muted:#5B6270; --on:#FFFFFF;
  --border:#D5DAE1; --border-strong:#878E99;
  --success:#167A4C; --success-soft:#E2F3E9; --info:#2459A6; --info-soft:#E3ECF8;
  --review:#8A5300; --review-soft:#FBEBCF; --urgent:#B42318; --urgent-soft:#FDE6E3;
  --scrim:rgba(14,17,22,.72); --pose:#FFC247; --gold:#F2A93B; --partial:#D9B27C;
  --stage:#DDE1E7;
  --font:"Figtree","Helvetica Neue",Arial,sans-serif;
  --r-sm:8px; --r-md:16px; --r-lg:20px;
  --shadow:0 1px 2px rgba(14,17,22,.04),0 4px 14px rgba(14,17,22,.05);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--font);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--info);outline-offset:2px}
button:disabled{cursor:not-allowed}

.tool{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--raised);border-bottom:1px solid var(--border);font-size:14px}
.tool b{font-weight:600}.tool .sp{flex:1}.tool .hint{color:var(--ink-muted)}
.tool button,.tool select{height:34px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--raised);font-size:14px;font-weight:500}
.stagewrap{flex:1;min-height:0;position:relative;overflow:hidden}
.device{position:absolute;left:50%;top:50%;width:1194px;height:834px;border-radius:28px;overflow:hidden;background:var(--surface);box-shadow:0 10px 40px rgba(14,17,22,.18)}

/* app shell */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.content{flex:1;min-height:0;overflow-y:auto;padding:28px 40px 28px}
.content.big{zoom:1.1}
.tabbar{flex:0 0 92px;display:flex;justify-content:center;gap:8px;background:var(--raised);border-top:1px solid var(--border);padding:8px 24px 12px}
.tab{flex:0 1 180px;border:0;background:none;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:17px;font-weight:600;color:var(--ink-muted);position:relative}
.tab[aria-current="page"]{color:var(--ink);background:var(--sunken)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 10px);min-width:22px;height:22px;border-radius:11px;background:var(--urgent);color:var(--on);font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tab img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.tab[aria-current="page"] img{box-shadow:0 0 0 2px var(--ink)}

.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;min-height:64px}.phead h1{padding-top:8px}
.phead h1{margin:0;font-size:40px;line-height:48px;font-weight:600;letter-spacing:-0.02em}
.phead .sub{margin:4px 0 0;font-size:22px;color:var(--ink-body)}
.avatar{margin-left:auto;width:64px;height:64px;border-radius:50%;border:0;padding:0;overflow:hidden;flex:0 0 64px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ini{width:52px;height:52px;border-radius:50%;background:#D6C2AE;color:#3A2A1C;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;flex:0 0 52px}
.back{height:56px;padding:0 22px 0 16px;border-radius:999px;border:1px solid var(--border);background:var(--raised);font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.card{background:var(--raised);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.eyebrow{font-size:16px;font-weight:600;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
h2{margin:0;font-size:28px;line-height:36px;font-weight:600;letter-spacing:-0.01em}
.main{height:72px;min-width:300px;padding:0 36px;border-radius:var(--r-lg);border:0;background:var(--ink);color:var(--on);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.main:disabled{background:var(--sunken);color:var(--ink-muted)}
.sec{height:64px;padding:0 26px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--raised);font-size:21px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.sos{font-size:18px;color:var(--ink-muted)}
.sos.ban{padding:10px 16px;border-radius:var(--r-sm);background:var(--urgent-soft);color:var(--urgent);font-weight:600}

/* exercise rows with thumbnails */
.exrow{display:flex;align-items:center;gap:18px;padding:14px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--raised);width:100%;text-align:left}
.exrow img{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:0 0 96px}
.exrow b{display:block;font-size:23px;font-weight:600}
.exrow span{font-size:19px;color:var(--ink-muted)}
.exrow .chev{margin-left:auto;color:var(--ink)}
.exlist{display:flex;flex-direction:column;gap:12px}.exrow{box-sizing:border-box}.tabbar{zoom:var(--tz,1)}.cover .lockup,.cover .covbtns{zoom:var(--tz,1)}

/* today */
.todaygrid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:stretch}.todaygrid>.card{height:100%;box-sizing:border-box}.todaygrid>.sess .exlist{flex:1;display:flex;flex-direction:column}.todaygrid>.sess .exrow{flex:1}
.sess{padding:28px;display:flex;flex-direction:column;gap:18px}
.sess .meta{display:flex;gap:10px;flex-wrap:wrap}
.metachip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--sunken);font-size:18px;font-weight:600}
.sideCol{display:flex;flex-direction:column;gap:16px}
.streak{padding:24px;display:flex;align-items:center;gap:16px;background:var(--success-soft);box-shadow:none}
.streak .n{font-size:56px;line-height:56px;font-weight:600;letter-spacing:-0.03em;color:var(--success)}
.streak .l{font-size:20px;line-height:26px;color:var(--ink-body)}
.streak .nx{font-size:17px;color:var(--ink-muted)}
.ptmsg{padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.ptmsg .who{display:flex;align-items:center;gap:12px}
.ptmsg .who b{font-size:20px;font-weight:600}.ptmsg .who div span{display:block;font-size:16px;color:var(--ink-muted)}
.ptmsg p{margin:0;font-size:21px;line-height:30px;color:var(--ink-body)}
.notice{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r-lg);background:var(--info-soft);margin-bottom:20px;font-size:21px}
.notice button{margin-left:auto;height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--ink);color:var(--on);font-size:19px;font-weight:600}
.donecard{padding:28px;display:flex;flex-direction:column;gap:16px;border:0;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}.dpain{border-top:1px solid var(--border);padding-top:18px;display:flex;flex-direction:column;gap:8px}.dpain h3{margin:0;font-size:22px;font-weight:600}.dpain .lg{display:flex;gap:18px;font-size:16px;color:var(--ink-muted)}.dpain .lg span{display:inline-flex;align-items:center;gap:8px}.dpain .lg i.ln{display:inline-block;width:22px;height:0;border-top:3.5px solid var(--success)}.dpain .lg i.ln.dash{border-top:3.5px dotted #8E96A2}
.donehead{display:flex;align-items:center;gap:14px}
.donehead .ck{width:52px;height:52px;border-radius:50%;background:var(--success);color:var(--on);display:flex;align-items:center;justify-content:center}

.avatar{position:relative;overflow:visible}.avatar img{border-radius:50%}
.mbadge{position:absolute;right:-6px;bottom:-6px;border-radius:50%;background:var(--raised);box-shadow:0 1px 4px rgba(14,17,22,.25);display:flex;align-items:center;justify-content:center}
.tabav{position:relative;display:block;width:30px;height:30px}.tabav .mbadge{right:-8px;bottom:-6px}
.idav{position:relative;display:block;margin-bottom:10px}.idav img{margin-bottom:0}.idav .mbadge{right:0;bottom:0}
.mtag{display:inline-flex;align-items:center;gap:6px;margin:4px 0 6px;padding:4px 12px 4px 6px;border-radius:999px;background:var(--success-soft);font-size:16px;font-weight:600;color:var(--ink)}
.wk{border:0;width:100%;text-align:left;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.wkhead{display:flex;align-items:center;justify-content:space-between}.wkhead b{font-size:21px;font-weight:600}
.wkbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.wkbar div{display:flex;flex-direction:column;gap:6px;align-items:center}
.wkbar i{display:block;width:100%;height:16px;border-radius:8px;background:var(--sunken)}
.wkbar i.done{background:var(--success)}.wkbar i.partial{background:var(--partial)}.wkbar i.today{background:var(--raised);box-shadow:inset 0 0 0 3px var(--success)}
.wkbar span{font-size:16px;font-weight:600;color:var(--ink-muted)}
.sharecard{margin-top:16px;padding:22px 24px;display:flex;align-items:center;gap:20px}
.sharecard b{display:block;font-size:22px;font-weight:600}.sharecard span{font-size:18px;color:var(--ink-body)}.sharecard button{margin-left:auto;flex:0 0 auto}
.preview{padding:18px 20px;border-radius:var(--r-md);background:var(--sunken);font-size:19px;line-height:28px}
.preview small{display:block;font-size:15px;font-weight:600;color:var(--ink-muted);margin-bottom:4px}
.recips{display:flex;gap:8px;flex-wrap:wrap}
.recip{height:56px;padding:0 20px;border-radius:999px;border:1px solid var(--border);background:var(--raised);font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px}
.recip[aria-pressed="true"]{background:var(--ink-sel);border-color:var(--ink-sel);color:var(--on)}

.rseg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:4px}
.rseg button{height:52px;padding:0 26px;border:0;border-radius:999px;background:transparent;font-size:19px;font-weight:600;color:var(--ink-body)}
.rseg button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.dp{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pd{height:84px;border-radius:999px;border:1px solid var(--border);background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.dp.big .pd{height:108px;gap:4px;width:100%;max-width:92px;justify-self:center}
.pd small{font-size:20px;font-weight:600;color:var(--ink-muted)}.pd b{font-size:24px;font-weight:600}
.dp.big .pd b{font-size:28px}.pd em{font-style:normal;height:24px;display:flex;align-items:center;font-size:18px;font-weight:600}
.pd.done{background:var(--success);border-color:var(--success);color:var(--on)}.pd.done small{color:var(--on)}
.pd.miss{background:var(--sunken);border-color:var(--sunken)}.mc.miss{background:var(--sunken)}
.pd.today{border:3px solid var(--ink)}.pd.today.done{outline:3px solid var(--ink);outline-offset:3px;border-color:var(--success)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 8px;margin-top:16px;text-align:center}
.mgrid .wd{font-size:16px;font-weight:600;color:var(--ink-muted);padding-bottom:4px}
.mc{height:50px;width:50px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--ink)}
.mc.done{background:var(--success);color:var(--on)}.mc.today{box-shadow:inset 0 0 0 3px var(--ink)}.mc.out{color:#A9B0BA;font-weight:500}
.cap{font-size:18px;color:var(--ink-body);margin:12px 0 4px}
.phd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.phd h2{font-size:24px}.rseg.sm button{height:44px;padding:0 16px;font-size:17px}
.pnow{display:flex;align-items:baseline;gap:6px;margin:10px 0 6px;flex-wrap:wrap}.pnow b{font-size:56px;line-height:56px;font-weight:600;color:var(--success);letter-spacing:-0.03em}.pnow .of{font-size:22px;color:var(--ink-muted);margin-right:12px}.pnow .msg{font-size:21px;font-weight:600;color:var(--ink)}
.psum{font-size:20px;line-height:28px;color:var(--ink-body);margin:6px 0 12px}.psum b{color:var(--ink)}
.chart .lg{display:flex;gap:18px;flex-wrap:wrap;font-size:16px;color:var(--ink-muted);margin-bottom:4px}
.chart .lg i.ln{width:22px;height:0;border-top:3.5px solid var(--success);border-radius:2px;display:block}.chart .lg i.ln.dash{border-top:3.5px dotted #8E96A2}
.chart .lg .scale{margin-left:auto}
.sectionhead h2{margin:0}
/* chat */
.chathead{display:flex;flex:0 0 auto;padding:20px 40px 16px;background:var(--surface);border-bottom:1px solid var(--border);margin:0;align-items:center;gap:16px;justify-content:flex-start}.chathead .callb{margin-left:auto;min-width:0;height:60px;padding:0 22px;display:flex;align-items:center;gap:10px}
.ini.sm{width:44px;height:44px;flex:0 0 44px;font-size:16px}.ini.lg{width:64px;height:64px;flex:0 0 64px;font-size:24px}
.thread{display:flex;flex-direction:column;gap:6px;padding:8px 0 16px}
.mrow{display:flex;align-items:flex-end;gap:10px}.mrow.me{justify-content:flex-end}.avsp{width:44px;flex:0 0 44px}
.mrow .bub{max-width:62%}
.meta{font-size:15px;color:var(--ink-muted);margin:2px 0 10px 54px}.meta.me{text-align:right;margin-left:0}
.sep{align-self:center;font-size:16px;font-weight:600;color:var(--ink-muted);padding:14px 0 6px}
.sysnote{align-self:center;text-align:center;font-size:16px;color:var(--ink-muted);background:var(--sunken);border-radius:14px;padding:10px 18px;margin-bottom:4px}
.bub.sess{align-self:flex-end;background:var(--raised);box-shadow:var(--shadow);border-bottom-right-radius:6px;min-width:340px}
.bub.sess .sh{display:flex;align-items:center;gap:10px;font-size:19px}.bub.sess .ck{width:32px;height:32px;border-radius:50%;background:var(--success);color:var(--on);display:flex;align-items:center;justify-content:center}
.bub.sess .sg{display:flex;gap:28px;margin-top:10px}.bub.sess .sg b{display:block;font-size:26px;line-height:30px}.bub.sess .sg span{font-size:15px;color:var(--ink-muted)}
.vb{display:flex;align-items:center;gap:14px;padding:12px 18px}
.vplay{width:48px;height:48px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex:0 0 48px}
.bub.me .vplay{background:var(--on);color:var(--ink)}.bub.them .vplay{background:var(--ink-sel);color:var(--on)}
.vplay svg{width:22px;height:22px}
.wave{display:flex;align-items:center;gap:3px;height:30px}.wave i{width:4px;border-radius:2px;background:currentColor;opacity:.55;display:block}
.wave.on i{opacity:1}.dur{font-size:16px;opacity:.85}
.bub.photo{padding:6px;background:var(--ink-sel);border-bottom-right-radius:6px}
.ph{width:280px;height:200px;border-radius:16px;background:linear-gradient(160deg,#DCC7B4,#B99A80);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#3A2A1C;font-size:17px;font-weight:600}
.typing{display:flex;gap:6px;align-items:center;padding:18px 20px}.typing i{width:10px;height:10px;border-radius:50%;background:var(--ink-muted);display:block;animation:tdot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}
.composer{background:var(--raised);border-top:1px solid var(--border)}.composer .compose{border-top:0;background:none}
.qrs{display:flex;gap:8px;padding:14px 40px 0;flex-wrap:wrap}
.qr{height:52px;padding:0 20px;border-radius:999px;border:1px solid var(--border);background:var(--raised);font-size:18px;font-weight:600;color:var(--ink)}
.rec{flex:1;height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;border-radius:999px;background:var(--urgent-soft);color:var(--urgent);font-size:20px;font-weight:600}
.rdot{width:14px;height:14px;border-radius:50%;background:var(--urgent)}.rt{font-variant-numeric:tabular-nums}.rec .wave{margin-left:auto}
.optrow{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;margin-top:10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--raised);text-align:left}
.optrow .oi{width:56px;height:56px;border-radius:14px;background:var(--sunken);display:flex;align-items:center;justify-content:center;flex:0 0 56px}
.optrow b{display:block;font-size:21px}.optrow span span{font-size:17px;color:var(--ink-muted)}.optrow .chev{margin-left:auto}
.sheet .box p.bignum{font-size:40px;line-height:48px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;margin:8px 0;user-select:all}
.campv{height:300px;border-radius:var(--r-md);background:#1B1F26;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px;gap:10px;position:relative;font-size:18px;margin-top:8px}
.campv .guide{position:absolute;inset:40px 30% 64px;border:3px dashed rgba(255,255,255,.6);border-radius:50%}
.campv.taken{background:linear-gradient(160deg,#DCC7B4,#B99A80);color:#3A2A1C}.campv.taken .guide{display:none}

.timein{height:60px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--border-strong);font:inherit;font-size:22px;font-weight:600;color:var(--ink);background:var(--raised)}
.tsz{display:flex;gap:8px}.tsz button{width:68px;height:64px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--raised);color:var(--ink);font-weight:600;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;line-height:1}
.tsz button[aria-checked="true"]{background:var(--ink-sel);border-color:var(--ink-sel);color:var(--on)}
.sharecard.cheer{background:var(--success-soft);box-shadow:none;position:relative;overflow:hidden;padding:20px 24px}
.sharecard.cheer::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 46% 22%,#F2A93B 0 5px,transparent 6px),radial-gradient(circle at 58% 78%,#167A4C 0 4px,transparent 5px),radial-gradient(circle at 66% 30%,#F2A93B 0 3px,transparent 4px),radial-gradient(circle at 37% 82%,#F2A93B 0 4px,transparent 5px),radial-gradient(circle at 72% 64%,#C98A4B 0 3px,transparent 4px)}
.sharecard.cheer b{font-size:24px;color:var(--ink)}.sharecard.cheer>*{position:relative}
.cart{width:72px;height:72px;flex:0 0 72px}.cart svg{width:72px;height:72px}.nuclimb,.nuclimb svg{width:80px;height:80px;flex:0 0 80px}
.stagecard{padding:28px}.sthead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.sthead h2{font-size:34px;line-height:42px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:64px}
.stg .bar{height:12px;border-radius:6px;background:var(--sunken);position:relative;margin-bottom:12px}
.stg.past .bar{background:var(--success)}.stg.now .bar{background:linear-gradient(90deg,var(--success) 50%,var(--sunken) 50%)}
.stg .here{position:absolute;left:50%;top:-40px;transform:translateX(-50%);background:var(--ink);color:var(--on);font-size:15px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap}
.stg .here::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.stg b{display:block;font-size:19px;font-weight:600;color:var(--ink-muted)}.stg span{font-size:16px;color:var(--ink-muted)}
.stg.now b{color:var(--ink)}.stg.past b{color:var(--ink-body)}
.stnow{margin:20px 0 0;font-size:20px;line-height:28px;color:var(--ink-body)}.stnow b{color:var(--ink)}
.plangrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;align-items:start}

 let h;

  const compose=S.tab==='messages'?composeHtml():'';
  h=`<div class="app">${S.tab==='messages'?chatHead():''}<div class="content" id="content"><div class="zoomer">${page}</div></div>${compose}<nav class="tabbar" aria-label="Main">${tabs}</nav></div>${sheetHtml()}`;
 } else {const v=V[S.screen];if(!v)return;h=v()+(S.sheet==='techhelp'?sheetHtml():'')+(S.sexit?endSheet(S.results.length?"What you've done so far is saved and sent to your PT.":"You haven't started any exercises yet. You can come back anytime today.",'data-sexitno','data-sexityes'):'');}
 const sc=document.getElementById('content');const keep=sc&&S._keepScroll?sc.scrollTop:0;
 dev.style.setProperty('--tz',[.92,1,1.1,1.2][S.textSize]);dev.innerHTML=h;dev.classList.toggle('a-bold',S.a11y.bold);dev.classList.toggle('a-contrast',S.a11y.contrast);dev.classList.toggle('a-motion',S.a11y.motion);
 const nc=document.getElementById('content');if(nc){nc.scrollTop=S._keepScroll?keep:0;if(S.tab==='messages')nc.scrollTop=nc.scrollHeight;}S._keepScroll=false;
 document.getElementById('jump').value=S.screen==='tabs'?(S.phase==='waiting'&&S.tab==='today'?'waiting':S.tab):S.screen==='onboard'?'ob'+S.ob.step:S.screen;
 document.getElementById('skip').hidden=S.screen!=='exercise';document.getElementById('simvisit').hidden=S.phase!=='waiting';document.getElementById('simplan').hidden=!!S.phase||S.screen==='onboard';document.getElementById('simplan').textContent=S.planUpdated?'Undo: PT updated plan':'Simulate: PT updated plan';
 bindInputs();

 const oc=document.getElementById('obcode');if(oc)oc.addEventListener('input',()=>{oc.value=oc.value.toUpperCase().replace(/[^A-Z0-9]/g,'');S.ob.code=oc.value;const j=dev.querySelector('[data-objoin]');if(j)j.disabled=S.ob.code.length!==6;});

 ['obfn','obfp'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{S.ob[id==='obfn'?'famName':'famPhone']=el.value;});});

function toTab(t){clearT();S.upView=null;S.histView=null;S.hvid=null;S.infoEdit=null;S.remEdit=false;S.famEdit=null;S.screen='tabs';S.tab=t;S.vidPlay=false;S.sheet=null;if(t==='messages')S.unread=0;render();}
function go(scr){clearT();S.paused=false;S.ending=false;S.sexit=false;S.resting=false;S.vidPlay=false;
 if(scr.startsWith('tab:')){toTab(scr.slice(4));return;}

/* exercise engine */
/* One rep done. fix: the camera's correction for this rep ('' = good rep); undefined = demo timer. Returns true if the set goes on. */
function stepRep(fix){const e=PLAN[S.exIdx],t=target(e);S.rep++;S.fixOn=fix!==undefined?!!fix:(S.set===1&&(S.rep===4||S.rep===5));S.fixText=fix||null;
 if(S.rep>=t){if(S.set>=nsets(e)){S.results.push({id:e.id,reps:t*nsets(e)});S.fixOn=false;render();later(finishExercise,700);return false;}
  render();later(()=>{S.set++;S.rep=0;S.resting=true;S.restLeft=15;S.fixOn=false;render();later(restTick,1000);},600);return false;}
 render();return true;}
function tick(){if(S.screen!=='exercise'||S.paused||S.ending||S.resting)return;if(window.CAM&&CAM.counting())return; /* the camera counts (detection-live.js) */
 if(stepRep())later(tick,750);}
function camRep(fix){if(S.screen!=='exercise'||S.paused||S.ending||S.resting)return false;stepRep(fix||'');return true;}
function restTick(){if(!S.resting||S.screen!=='exercise')return;if(S.paused||S.ending){later(restTick,1000);return;}S.restLeft--;if(S.restLeft<=0){endRest();return;}render();later(restTick,1000);}
function endRest(){S.resting=false;render();later(tick,700);}
function advanceEx(){if(S.exIdx<PLAN.length-1){S.exIdx++;go('intro');return;}S.endPain=null;S.bother=[];S.botherT=false;go('wrap');}

 return `<div class="sheet"><div class="box endbox"><h2>End today's session?</h2><p>${msg}</p>
 <p class="q" style="font-size:22px;margin:8px 0 10px">Why are you stopping? <span style="font-weight:400;color:var(--ink-muted)">(optional)</span></p>
 <div class="whyc">${['Tired','Pain','No time','Something else'].map(r=>`<button class="choice" data-stopwhy="${r}" aria-pressed="${w===r}">${r}</button>`).join('')}</div>
 ${pain?`<p class="q" style="font-size:20px;margin:16px 0 8px">How bad is the pain?</p>${painGrid('stopPain')}`:''}
 ${w==='Something else'?`<input class="whyin" id="stopo" value="${esc(S.stopO||'')}" placeholder="Tell us why" aria-label="Why are you stopping">`:''}

 <div class="row" style="margin-top:18px"><button class="sec" ${no}>Keep going</button><button class="main" style="min-width:0" ${yes} ${ok?'':'disabled'}>End session</button></div></div></div>`;}

function startExercise(){S.set=1;S.rep=0;S.fixOn=false;S.fixText=null;if(window.CAM)CAM.startExercise(PLAN[S.exIdx]);go('exercise');later(tick,900);}

 const m=S.medalNew;const ov=document.createElement('div');ov.className='cele-ov';ov.setAttribute('role','status');

 if(d.symyes){const k=d.symyes;S[k+'Y']=true;if(!S[k].length)S[k+'T']=false;render();return;}
 if(d.sym){const k=d.sym;S[k+'T']=true;S[k]=d.v==='none'?[]:(S[k].includes(d.v)?S[k].filter(x=>x!==d.v):S[k].concat(d.v));if(d.v!=='none'){S[k+'Y']=true;S[k+'T']=S[k].length>0;}render();return;}
 if(d.feel){S.feel=d.feel;S.feels=S.feels||{};S.feels[S.exIdx]=d.feel;if(d.feel!=='Too hard'){S.painAfter=null;}render();return;}
 if(d.bother){S.botherT=true;S.bother=S.bother||[];if(d.bother==='none')S.bother=[];else S.bother=S.bother.includes(d.bother)?S.bother.filter(x=>x!==d.bother):S.bother.concat(d.bother);S._keepScroll=true;render();return;}
 if(d.why){S.whys=S.whys||{};S.whys[d.why]=S.whys[d.why]===d.v?null:d.v;S._keepScroll=true;render();return;}
 if(d.afterback!==undefined){S.set=1;S.rep=0;go('intro');return;}
 if(d.wrapback!==undefined){S.feel=(S.feels||{})[S.exIdx]||null;go('after');return;}
 if(b.id==='painNext'){const p=S.painBefore;if(p>=7||S.symBefore.some(x=>x!=='Something else')){go('rest');return;}S.mode=p<=3?'full':p<=5?'l70':'l50';S.exIdx=0;S.results=[];go('todayPlan');return;}
 if(b.id==='afterNext'){if(S.painAfter>=7){go('stop');return;}advanceEx();return;}
 if(b.id==='wrapNext'){if(S.endPain>=7){go('stop');return;}finishSession();return;}
 if(b.id==='startEx'){startExercise();return;}
 if(d.vid!==undefined){S.vidPlay=!S.vidPlay;S._keepScroll=true;render();return;}
 if(d.voice!==undefined){S.voice=d.voice==='on';render();return;}
 if(d.vtoggle!==undefined){S.voice=!S.voice;render();return;}
 if(d.flip!==undefined){S.flip=!S.flip;render();return;}
 if(d.pause!==undefined){S.paused=true;clearT();render();return;}
 if(d.resume!==undefined){S.paused=false;S.resting=false;render();later(tick,700);return;}
 if(d.sexit!==undefined){S.sexit=true;S.stopWhy=null;S.stopPain=null;render();return;}
 if(d.stopwhy){S.stopWhy=S.stopWhy===d.stopwhy?null:d.stopwhy;if(S.stopWhy!=='Pain')S.stopPain=null;render();return;}
 if(d.sexitno!==undefined){S.sexit=false;render();return;}
 if(d.sexityes!==undefined){S.sexit=false;if(S.stopPain>=7){go('stop');return;}if(S.results.length)finishSession(true);else toTab('today');return;}
 if(d.startex!==undefined){startExercise();return;}
 if(d.tutstart!==undefined){S.exIdx=S.tutIdx||0;go('setup');return;}
 if(d.tut!==undefined){S.tutIdx=+d.tut;S.vidPlay=false;go('tut');return;}
 if(d.restskip!==undefined){clearT();endRest();return;}
 if(d.exback!==undefined){clearT();S.resting=false;S.set=1;S.rep=0;go('intro');return;}
 if(d.end!==undefined){S.stopWhy=null;S.stopPain=null;S.ending=true;clearT();render();return;}
 if(d.keep!==undefined){S.ending=false;S.paused=false;S.resting=false;render();later(tick,700);return;}
 if(d.endyes!==undefined){const e=PLAN[S.exIdx];if(S.rep>0||S.set>1)S.results.push({id:e.id,reps:(S.set-1)*target(e)+S.rep});S.ending=false;if(S.stopPain>=7){go('stop');return;}if(S.results.length)finishSession(true);else toTab('today');return;}
 if(d.mic!==undefined){S.mic=!S.mic;render();if(S.mic)later(()=>{S.note='My knee felt a bit stiff after climbing the stairs yesterday.';S.mic=false;S.noteSaved=false;render();},1800);return;}
 if(d.savenote!==undefined){S.noteSaved=true;S.msgs.push({me:true,t:S.note.trim(),w:'Just now'});render();return;}
 if(d.micmsg!==undefined){S.mic=!S.mic;render();if(S.mic)later(()=>{S.draft='Is it normal for my knee to feel warm after exercising?';S.mic=false;render();},1800);return;}
 if(d.send!==undefined){sendMsg();return;}
 if(d.recshare!==undefined){S.recShared=true;render();return;}
 if(d.planask!==undefined){S.draft='About my new plan: ';toTab('messages');return;}
 if(d.planok!==undefined){S.planSeen=true;toTab('today');return;}
 if(d.prng){S.prange=d.prng;S._keepScroll=true;render();return;}
 if(d.rng){S.range=d.rng;S.weekOff=0;S.monthOff=0;S._keepScroll=true;render();return;}
 if(d.step){const k=+d.step;if(S.range==='month')S.monthOff=Math.max(-1,Math.min(0,S.monthOff+k));else S.weekOff=Math.max(-3,Math.min(0,S.weekOff+k));S._keepScroll=true;render();return;}
 if(d.qr){S.draft=d.qr;render();const x=document.getElementById('draft');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}return;}
 if(d.recstart!==undefined){S.rec=0;render();const tick=()=>later(()=>{if(S.rec==null)return;S.rec++;render();tick();},1000);tick();return;}
 if(d.reccancel!==undefined){S.rec=null;clearT();render();return;}
 if(d.recsend!==undefined){const dur=Math.max(S.rec,3);S.rec=null;clearT();S.msgs.push({me:true,type:'voice',id:mid++,dur,w:'Just now'});render();danaReply('Thanks for the voice message, Walter. I\'ll listen and get back to you today.');return;}
 if(d.playv){const id=+d.playv;if(S.playing===id){S.playing=null;}else{S.playing=id;const m=S.msgs.find(x=>x.id===id);later(()=>{if(S.playing===id){S.playing=null;render();}},(m?m.dur:5)*1000);}S._keepScroll=true;render();return;}
 if(d.takephoto!==undefined){S.photoTaken=true;S._keepScroll=true;render();return;}
 if(d.retake!==undefined){S.photoTaken=false;S._keepScroll=true;render();return;}
 if(d.sendphoto!==undefined){S.photoTaken=false;S.sheet=null;S.msgs.push({me:true,type:'photo',w:'Just now'});render();danaReply('Thanks for the photo, Walter. I\'ll take a look and call you if anything needs attention.');return;}
 if(d.sharesess!==undefined){S.sheet=null;const last=allDays().filter(x=>isDone(x)&&x.min).pop();S.msgs.push({me:true,type:'session',m:last.m,n:last.n,w:'Just now'});render();danaReply('Nice work, Walter. Your numbers look steady. Keep it up.');return;}
 if(d.upv!==undefined){S.upView=+d.upv;render();return;}
 if(d.upback!==undefined){S.upView=null;render();return;}
 if(d.addcal!==undefined){S.calAdded=true;S._keepScroll=true;render();return;}
 if(d.hist){S.histView=d.hist;S.hvid=null;render();return;}
 if(d.histback!==undefined){S.histView=null;S.hvid=null;render();return;}
 if(d.hvid!==undefined){const i=+d.hvid;S.hvid=S.hvid===i?null:i;S._keepScroll=true;render();return;}
 if(d.toggle){S[d.toggle]=!S[d.toggle];S._keepScroll=true;render();return;}
 if(d.tsz!==undefined){S.textSize=+d.tsz;S._keepScroll=true;render();return;}
 if(d.text!==undefined){S.bigText=d.text==='1';S._keepScroll=true;render();return;}
 if(d.sheet){S.sheet=d.sheet;S.famForm={name:'',rel:'Daughter',phone:''};S._keepScroll=true;render();return;}
 if(d.recip!==undefined){const i=+d.recip;S.shareTo=S.shareTo.includes(i)?S.shareTo.filter(x=>x!==i):S.shareTo.concat(i);S._keepScroll=true;render();return;}
 if(d.sendshare!==undefined){const sn=document.getElementById('sharenote');S.shareNote='';S.sharedNames=S.shareTo.map(i=>S.family[i].name).join(' and ');S.sheet='shared';S.shareTo=null;S._keepScroll=true;render();return;}
 if(d.info){S.infoEdit=d.info;S.infoSaved=null;render();return;}
 if(d.famedit!==undefined){S.famEdit=+d.famedit;S.famSaved=null;render();return;}
 if(d.famback!==undefined){S.famEdit=null;render();return;}
 if(d.famrm!==undefined){S.family.splice(S.famEdit,1);S.famEdit=null;render();return;}
 if(d.famsave!==undefined){const f=S.family[S.famEdit];const g=id=>document.getElementById(id).value.trim();if(g('ff_name'))f.name=g('ff_name');f.rel=g('ff_rel');f.phone=g('ff_phone');f.how=g('ff_how');S.famSaved=S.famEdit;S.famEdit=null;render();return;}
 if(d.remedit!==undefined){S.remFrom=S.tab==='today'?S.upView:null;if(S.remFrom!=null){S.tab='profile';}S.remEdit=true;S.remSaved=false;S._remBak=JSON.parse(JSON.stringify(S.rem));S._remT=S.reminder;render();return;}
 if(d.remback!==undefined){S.rem=S._remBak||S.rem;S.reminder=S._remT||S.reminder;S.remEdit=false;if(S.remFrom!=null){S.tab='today';S.upView=S.remFrom;S.remFrom=null;}render();return;}
 if(d.remsave!==undefined){S.remEdit=false;S.remSaved=true;if(S.remFrom!=null){S.tab='today';S.upView=S.remFrom;S.remFrom=null;}render();return;}
 if(d.remon!==undefined){S.rem.on=!S.rem.on;S._keepScroll=true;render();return;}
 if(d.rnudge!==undefined){S.rem.nudge=!S.rem.nudge;S._keepScroll=true;render();return;}
 if(d.rfreq){S.rem.freq=d.rfreq;S._keepScroll=true;render();return;}
 if(d.rafter){S.rem.after=+d.rafter;S._keepScroll=true;render();return;}
 if(d.rend){S.rem.end=d.rend;S._keepScroll=true;render();return;}
 if(d.remmo){S.remMo=Math.max(0,Math.min(3,S.remMo+(+d.remmo)));S._keepScroll=true;render();return;}
 if(d.rskip){const r=S.rem;r.skip=r.skip.includes(d.rskip)?r.skip.filter(x=>x!==d.rskip):r.skip.concat(d.rskip);S._keepScroll=true;render();return;}
 if(d.rday){const r=S.rem;r.days=r.days.includes(d.rday)?r.days.filter(x=>x!==d.rday):DAYS7.filter(x=>r.days.includes(x)||x===d.rday);S._keepScroll=true;render();return;}
 if(d.rhow){const r=S.rem;if(r.how.includes(d.rhow)){if(r.how.length>1)r.how=r.how.filter(x=>x!==d.rhow);}else r.how=r.how.concat(d.rhow);S._keepScroll=true;render();return;}
 if(d.infoback!==undefined){S.infoEdit=null;render();return;}
 if(d.a11y){S.a11y[d.a11y]=!S.a11y[d.a11y];S._keepScroll=true;render();return;}
 if(d.vspeed!==undefined){S.voiceSpeed=+d.vspeed;S._keepScroll=true;render();return;}
 if(d.saveinfo){const x=INFO.find(y=>y.k===d.saveinfo);x.f.forEach(([n])=>{const el=document.getElementById('if_'+n);if(el&&el.value.trim())S.info[n]=el.value.trim();});S.infoSaved=x.k;S.sheet=null;S.infoEdit=null;render();return;}
 if(d.skipstep!==undefined&&S.screen==='onboard'){const o=S.ob;S.sheet=null;if(o.sub<OBSUBS[o.step]-1)o.sub++;else{o.step++;o.sub=0;}render();return;}
 if(d.close!==undefined){S.sheet=null;S._keepScroll=true;render();return;}
 if(d.addfam!==undefined){const f=S.famForm;if(!f.name.trim()){const el=document.getElementById('famname');el.focus();el.style.borderColor='var(--urgent)';return;}S.family.push({name:f.name.trim(),rel:f.rel,how:f.phone.includes('@')?'Email':'Text',phone:f.phone.trim()});S.sheet=null;S._keepScroll=true;render();return;}
 if(d.rmfam!==undefined){S.family.splice(+d.rmfam,1);S._keepScroll=true;render();return;}
 if(d.signout!==undefined){S=fresh();clearT();render();return;}
});

const jump=document.getElementById('jump');{let h='',open=false;SCREENS.forEach(x=>{if(x[0]==='#'){if(open)h+='</optgroup>';h+='<optgroup label="'+x[1]+'">';open=true;}else h+='<option value="'+x[0]+'">'+x[1]+'</option>';});jump.innerHTML=h+(open?'</optgroup>':'');}
jump.addEventListener('change',()=>{const v=jump.value;
 if(v==='waiting'){S.phase='waiting';toTab('today');return;}
 if(/^ob\d$/.test(v)){S.ob=obFresh();S.ob.step=+v[2];if(S.ob.step>0){S.ob.joined=true;}S.phase=S.ob.step>=3?'ready':null;S.screen='onboard';clearT();render();return;}
 if(TABS.includes(v)){toTab(v);return;}
 if(v==='exdetail'){S.detail=0;S.from='plan';toTab('exdetail');return;}
 if(v==='todayPlan'&&S.painBefore===null){S.painBefore=4;S.mode='l70';}
 if(v==='exercise'){startExercise();return;}
 if(v==='after'){finishExercise();return;}
 if(v==='done'){S.mode='full';S.results=PLAN.map(e=>({id:e.id,reps:target(e)*e.sets}));S.streak=8;S.medalNew=null;S.early=false;}
 if(v==='planChange')S.planUpdated=true;
 if(v==='ptnotice'){S.planUpdated=true;S.planSeen=false;S.visitSet=false;toTab('today');return;}
 if(v==='newplan'){S.planUpdated=true;S.planSeen=true;S.visitSet=false;toTab('today');return;}
 if(v==='visit'){S.visitSet=true;toTab('today');return;}
 go(v);});
document.getElementById('restart').addEventListener('click',()=>{S=fresh();clearT();render();if(window.CR)CR.restart();});
document.getElementById('simvisit').addEventListener('click',()=>{S.phase='ready';toTab('today');});
document.getElementById('simplan').addEventListener('click',()=>{S.planUpdated=!S.planUpdated;S.planSeen=false;toTab('today');});
document.getElementById('skip').addEventListener('click',()=>{if(S.screen!=='exercise')return;clearT();const e=PLAN[S.exIdx];S.results.push({id:e.id,reps:target(e)*nsets(e)});finishExercise();});
S=fresh();
window.CRAPP={get S(){return S},V,PLAN,STS,CHANGES,WEEK,LASTWEEK,RESTD,MEDALS,WLAB,WEEKPLAN,render,go,toTab,target,nsets,camRep}; /* CoRehab hooks */
render();fit();if(window.CR)CR.init();
})();
