/* Layout: a 1440x900 desktop web app for the PT, scaled to fit under a slim prototype toolbar. Tokens follow the Homestretch design system. */
:root{

html,body{height:100%}

  {id:'ruth',who:'Ruth Coleman',why:'Monthly call (remote monitoring)',due:'By Nov 30',dueK:'rev',ph:'(412) 555-0131',done:S.callsDone.ruth},

 const hist=[].concat(S.callsDone.walter2?[{who:'Walter Miller',d:'Sun, Nov 22',m:'9 min',why:'New plan question',n:'Talked through sit-to-stands. Comfortable starting slow.'}]:[])
  .concat(S.callsDone.ruth?[{who:'Ruth Coleman',d:'Sun, Nov 22',m:'8 min',why:'Monthly',n:'Doing well, ready for discharge talk Tuesday.'}]:[])
  .concat(S.alertDone?[{who:'Frank Ortiz',d:'Sun, Nov 22',m:'8 min',why:'Alert follow-up',n:'Swelling and warmth. Booked Mon 9:00 visit.'}]:[])
  .concat([{who:'Linda Park',d:'Thu, Nov 12',m:'12 min',why:'Monthly',n:'Stairs still hard, pain steady at 3.'},
  {who:'Walter Miller',d:'Tue, Nov 10',m:'8 min',why:'Monthly',n:'Tablet set up, no concerns.'},
  {who:'Ruth Coleman',d:'Fri, Oct 30',m:'10 min',why:'Monthly',n:'Good week, asked about walking outside.'},
  {who:'Frank Ortiz',d:'Wed, Oct 28',m:'7 min',why:'Monthly',n:'Missed two sessions, back on track.'}]);
 const novDone=new Set(hist.filter(h=>/Nov/.test(h.d)).map(h=>h.who)).size;
 const pct=h=>((h-H0)/(H1-H0)*100).toFixed(3)+'%';
 return `<div class="mhead"><h1>Schedule</h1></div>
 <div class="schgrid"><div class="card wcal">${bar}${S.calV==='month'?monthV():`<div class="calhd" style="grid-template-columns:56px repeat(${cols.length},1fr)"><span></span>${cols.map(c=>`<b>${days[c]}</b>`).join('')}</div>
 <div class="calbody" style="grid-template-columns:56px repeat(${cols.length},minmax(0,1fr))"><div class="hrs">${Array.from({length:H1-H0},(_,i)=>`<span style="top:${pct(H0+i)}">${fmt(H0+i).replace(':00','')}</span>`).join('')}</div>
 ${cols.map((di,ci)=>`<div class="dcol" style="grid-column:${ci+2}">${evs.map((e,i)=>e.d!==di?'':`<button class="cev ${e.k}${S.evSel===i?' on':''}" data-ev="${i}" style="top:${pct(e.st)};height:calc(${(Math.max(e.len,40)/60/(H1-H0)*100).toFixed(3)}% - 4px)"><b>${(n=>{const w=n.split(' ');return w[0]+' '+w[1][0]+'.'})(e.who.replace('New patient: ',''))}</b><span>${fmt(e.st)}</span></button>`).join('')}</div>`).join('')}
 ${Array.from({length:H1-H0},(_,i)=>`<i class="hl" style="top:${pct(H0+i)}"></i>`).join('')}
 ${sel?`<div class="evd"><div><p class="eyebrow">${days[sel.d]} · ${fmt(sel.st)} to ${fmt(sel.st+sel.len/60)} · ${sel.type}</p><h2 style="margin-top:4px">${sel.who}</h2><p class="sub" style="margin-top:2px">${sel.why}</p><p class="ctxl" style="margin-top:8px"><b>Before the visit:</b> ${sel.prep}</p></div><div class="evdb"><button class="xbtn" data-ev="${S.evSel}" aria-label="Close">×</button>${sel.pid?`<button class="btn sec" data-go="${sel.pid}">Open patient</button>`:''}</div></div>`:''}</div>`}
 <div class="calkey"><span><i class="clin"></i>In clinic</span><span><i class="new"></i>New patient</span><span><i class="call"></i>Phone</span><span><i class="urg"></i>After an alert</span></div></div>
 <div class="schr"><div class="card pad"><div class="selhd"><h2>Calls to make</h2></div>
 <div class="clist">${calls.filter(c=>!c.done).map(c=>`<div class="crow"><div class="cmain"><b>${c.who}</b><span>${c.why}</span></div><span class="cdue${c.dueK==='urg'?' now':''}">${c.due}</span><div class="cact"><span class="cph">${I.phone}${c.ph}</span><button class="btn sec" data-logc="${c.id}">Log call</button></div></div>`).join('')||'<p class="sub" style="margin-top:8px">All calls made.</p>'}</div></div>
 <div class="card pad hcard"><div class="selhd"><h2>Call history</h2></div>
 <div class="hlist">${hist.map(h=>`<div class="hrow"><span class="hchk">${I.check}</span><div><div class="hrt"><b>${h.who}</b><span>${h.d}</span></div><p>${h.n}</p></div></div>`).join('')}</div></div></div></div>`;}
function render(){const v=((window.PTL&&PTL.live&&PTL.views[S.view])||{list:listView,intake:intakeView,visit:visitView,plan:planView,sent:sentView,wlist:wlistView,alert:alertView,review:reviewView,wplan:planView,wsent:wsentView,kept:keptView,wvisit:wvisitView,prof:profView,dis:disView,msg:msgView,sched:schedView}[S.view])(); /* CoRehab: live screens from pt-live.js */
 const sc=dev.querySelector('.main');const top=S._keep&&sc?sc.scrollTop:0;S._keep=false;
 dev.innerHTML=side()+`<main class="main">${v}</main>`;const m=dev.querySelector('.main');m.scrollTop=top;
 document.getElementById('jump').value=S.view;
 const vsv=()=>{const b=document.getElementById('vsave');if(!b)return;b.classList.add('ing');b.innerHTML='Saving…';clearTimeout(window._vs);window._vs=setTimeout(()=>{const c=document.getElementById('vsave');if(c){c.classList.remove('ing');c.innerHTML=I.check+'Saved just now';}},700);};
 dev.querySelectorAll('[data-v]').forEach(el=>el.addEventListener('input',()=>{S.visit[el.dataset.v]=el.value;vsv();}));
 const q=document.getElementById('q');if(q)q.addEventListener('input',()=>{S.q=q.value;S.ppage=1;S._keep=true;const pos=q.selectionStart;render();const q2=document.getElementById('q');q2.focus();q2.setSelectionRange(pos,pos);});
 const md=document.getElementById('mdraft');if(md){md.addEventListener('input',()=>{S.draft=md.value;const sb=dev.querySelector('[data-send]');if(sb)sb.disabled=!md.value.trim();});md.addEventListener('keydown',e=>{if(e.key==='Enter'&&md.value.trim()){dev.querySelector('[data-send]').click();}});}
 [['an','name'],['ap','ph'],['as','proc'],['ad','date']].forEach(([i,k])=>{const el=document.getElementById(i);if(el)el.addEventListener('input',()=>{S.af[k]=el.value;el.style.borderColor='';});});
 ['v_tug','v_cs'].forEach(i=>{const el=document.getElementById(i);if(el)el.addEventListener('change',()=>{S._keep=true;render();});});
 dev.querySelectorAll('[data-vtx]').forEach(el=>el.addEventListener('input',()=>{S.vdone[+el.dataset.vtx][0]=el.textContent;vsv();}));
 const va=document.getElementById('vadd');if(va){va.addEventListener('input',()=>{S.vadd=va.value;});va.addEventListener('keydown',e=>{if(e.key==='Enter'&&va.value.trim()){S.vdone.push([va.value.trim(),1]);S.vadd='';S._keep=true;render();document.getElementById('vadd').focus();}});}
 const pnt=document.getElementById('pnotes');if(pnt)pnt.addEventListener('input',()=>{S.pnotes[S.pid]=pnt.value;const b=document.getElementById('nsave');b.classList.add('ing');b.innerHTML='Saving…';clearTimeout(window._ns);window._ns=setTimeout(()=>{const c=document.getElementById('nsave');if(c){c.classList.remove('ing');c.innerHTML=I.check+'Saved just now';}},700);});
 const tm=document.getElementById('tmsgs');if(tm)tm.scrollTop=tm.scrollHeight;
 const pn=document.getElementById('pnote');if(pn)pn.addEventListener('input',()=>{if(S.view==='wplan'||S.view==='review')S.wnote=pn.value;else S.note=pn.value;});
 dev.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('input',()=>{S.callForm[el.dataset.cf]=el.value;}));
 dev.querySelectorAll('[data-vf]').forEach(el=>el.addEventListener('input',()=>{S.visitF[el.dataset.vf]=el.value;}));}
dev.addEventListener('click',ev=>{const b=ev.target.closest('[data-mfil],[data-ev],[data-logc],[data-calv],[data-vset],[data-vck],[data-fp],[data-fa],[data-fund],[data-capt],[data-dex],[data-dwwe],[data-dmin],[data-dck],[data-more],[data-addx2],[data-callnow],[data-libt],[data-vrm],[data-ptab],[data-ppage],[data-lpage],[data-addp],[data-addx],[data-adds],[data-pid],[data-mpanel],[data-calnav],[data-calpick],[data-thread],[data-qr],[data-send],[data-sug],[data-sendsug],[data-editsug],[data-go],[data-add],[data-step],[data-day],[data-filter],[data-logcall],[data-visitok],[data-disok]');if(!b||b.disabled)return;const d=b.dataset;
 if(d.mfil){S.mfilter=d.mfil;render();return;}
 if(d.ev!==undefined){S.evSel=S.evSel===+d.ev?null:+d.ev;S._keep=true;render();return;}
 if(d.mpanel){S['m'+d.mpanel]=!S['m'+d.mpanel];S._keep=true;render();return;}
 if(d.lpage!==undefined){S.lpage=+d.lpage;S._keep=true;render();return;}
 if(d.ppage!==undefined){S.ppage=+d.ppage;S._keep=true;render();const sc=dev.querySelector('.pscroll');if(sc)sc.scrollTop=0;return;}
 if(d.ptab){S.ppage=1;S.ptab=d.ptab;S._keep=true;render();return;}
 if(d.addp!==undefined){S.addOpen=true;S._keep=true;render();setTimeout(()=>{const a=document.getElementById('an');if(a)a.focus();});return;}
 if(d.addx!==undefined){S.addOpen=false;S._keep=true;render();return;}
 if(d.adds!==undefined){if(!S.af.name.trim()){const a=document.getElementById('an');a.focus();a.style.borderColor='var(--urgent)';return;}S.added.push({name:S.af.name.trim(),proc:S.af.proc});S.af={name:'',ph:'',proc:'Left knee replacement',date:'2026-11-12'};S.addOpen=false;S.ptab='new';S._keep=true;render();return;}
 if(d.pid){S.pid=d.pid;S.view='prof';render();return;}
 if(d.fp){S.fpMode=d.fp;S.frej=[];if(d.fp==='ai'){S.plan=[{id:'heel_slide',sets:3,reps:10},{id:'slr',sets:3,reps:10},{id:'ext',sets:3,reps:10},{id:'stbend',sets:3,reps:10}];S.fa={heel_slide:null,slr:null,ext:null,stbend:null};}else{S.plan=[];S.fa={};}S.view='plan';render();return;}
 if(d.fa){const [id,v]=d.fa.split('|');if(v==='1'){S.fa[id]=S.fa[id]===true?null:true;}else{const i=S.plan.findIndex(p=>p.id===id);if(i>=0)S.frej.push(S.plan.splice(i,1)[0]);S.fa[id]=false;}S._keep=true;render();return;}
 if(d.fund){const i=S.frej.findIndex(p=>p.id===d.fund);if(i>=0)S.plan.push(S.frej.splice(i,1)[0]);S.fa[d.fund]=null;S._keep=true;render();return;}
 if(d.libt!==undefined){S.libOpen=!S.libOpen;S._keep=true;render();return;}
 if(d.callnow!==undefined){const b=dev.querySelector('[data-callnow]');b.innerHTML=I.phone+'Calling Frank…';b.classList.add('calling');setTimeout(()=>{const c=dev.querySelector('[data-callnow]');if(c){c.innerHTML=I.phone+'Call (412) 555-0174';c.classList.remove('calling');}const m=document.getElementById('cf_o');if(m)m.focus();},1600);return;}
 if(d.addx2!==undefined){S.addEx=!S.addEx;S._keep=true;render();return;}
 if(d.more!==undefined){S.moreOpen=!S.moreOpen;S._keep=true;render();return;}
 if(d.dex){const i=S.disEx.indexOf(d.dex);if(i>=0)S.disEx.splice(i,1);else S.disEx.push(d.dex);S._keep=true;render();return;}
 if(d.dwwe!==undefined){S.disWwe=!S.disWwe;S._keep=true;render();return;}
 if(d.dmin){S.disMin=Math.max(5,Math.min(60,S.disMin+(+d.dmin)));S._keep=true;render();return;}
 if(d.dck!==undefined){if(+d.dck===3)S.disDoc=S.disDoc?0:1;S._keep=true;render();return;}
 if(d.capt!==undefined){S.capt=!S.capt;S._keep=true;render();return;}
 if(d.vck!==undefined){S.vdone[+d.vck][1]=S.vdone[+d.vck][1]?0:1;S._keep=true;render();return;}
 if(d.vrm!==undefined){S.vdone.splice(+d.vrm,1);S._keep=true;render();return;}
 if(d.vset){const [k,val]=d.vset.split('|');S.visit[k]=val;S._keep=true;render();return;}
 if(d.calv){S.calV=d.calv;S.evSel=null;S._keep=true;render();return;}
 if(d.calnav!==undefined){const n=+d.calnav;S.evSel=null;if(n===0){S.calOff=0;S.calDay=0;}else if(S.calV==='day'){S.calDay+=n;if(S.calDay>4){S.calDay=0;S.calOff++;}if(S.calDay<0){S.calDay=4;S.calOff--;}}else S.calOff+=n;S._keep=true;render();return;}
 if(d.calpick!==undefined){S.calV='day';S.calOff=+d.calwk;S.calDay=+d.calpick;S.evSel=null;S._keep=true;render();return;}
 if(d.logc){if(d.logc==='frank'){S.alertDone=true;S.calls.push(1);}else S.callsDone[d.logc]=true;S._keep=true;render();return;}
 if(d.thread){S.thread=d.thread;S.draft='';render();return;}
 if(d.qr){S.draft=d.qr;render();const m=document.getElementById('mdraft');m.focus();return;}
 if(d.send!==undefined){const t=S.threads.find(x=>x.id===S.thread);t.msgs.push(['me','Now',S.draft.trim(),'Sent']);S.draft='';render();return;}
 if(d.sug){S.sug[d.sug]=S.sug[d.sug]===d.v?null:d.v;syncSug();S._keep=true;render();return;}
 if(d.sendsug!==undefined){S.view='wsent';render();return;}
 if(d.editsug!==undefined){applySug();S.view='wplan';render();return;}
 if(d.logcall!==undefined){S.alertDone=true;S.calls.push(1);render();return;}
 if(d.visitok!==undefined){S.visitDone=true;render();return;}
 if(d.disok!==undefined){S.disDone=true;render();return;}
 if(d.thr)S.thread=d.thr;
 if(d.go)S.moreOpen=false;if(d.go==='dis')S.disFrom=d.dfrom||'review';
 if(d.go==='wplan')S.wfrom=d.from||'review';
 if(d.go){if(d.go==='wvisit'){S.visitFrom=S.view;S.visitFor=d.vfor||(S.view==='alert'?'Frank Ortiz':'Walter Miller');S.visitDone=false;S.visitF.why=S.visitFor==='Frank Ortiz'?'Check the swelling and redness in person':'Check the knee in person: bend and swelling';}if(d.go==='dis')S.disDone=false;S.view=d.go;render();return;}
 S._keep=true;
 if(d.add){const PL=cur();const i=PL.findIndex(p=>p.id===d.add);if(i>=0)PL.splice(i,1);else{const e=lib(d.add);PL.push({id:e.id,sets:e.sets,reps:e.reps});}render();return;}
 if(d.step!==undefined){const p=cur()[+d.step];p[d.k]=Math.max(1,Math.min(d.k==='sets'?5:20,p[d.k]+(+d.d)));render();return;}
 if(d.day!==undefined){const D=curDays();D[+d.day]=D[+d.day]?0:1;render();return;}
 if(d.filter){S.filter=d.filter;render();return;}});
dev.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('tr[data-go]')){S.view=ev.target.dataset.go;render();}});
